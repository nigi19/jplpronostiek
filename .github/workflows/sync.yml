name: Sync JPL Fixtures

on:
  schedule:
    # Daily at 03:00 UTC (before most evening matches are processed)
    - cron: "0 3 * * *"
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run SofaScore sync
        env:
          SOFASCORE_TOURNAMENT_ID: ${{ vars.SOFASCORE_TOURNAMENT_ID }}
          APP_URL: ${{ vars.APP_URL }}
          IMPORT_SECRET: ${{ secrets.IMPORT_SECRET }}
        run: python scripts/sofascore_sync.py
