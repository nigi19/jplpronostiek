name: Sync JPL Fixtures

on:
  # Schedule disabled: GitHub Actions runs on Azure IPs which Cloudflare blocks.
  # Use the local Mac launchd agent (scripts/com.jplpronostiek.sync.plist) instead.
  # Kept here for manual one-off triggers from the GitHub UI.
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run SofaScore sync
        env:
          SOFASCORE_TOURNAMENT_ID: ${{ vars.SOFASCORE_TOURNAMENT_ID }}
          APP_URL: ${{ vars.APP_URL }}
          IMPORT_SECRET: ${{ secrets.IMPORT_SECRET }}
        run: python scripts/sofascore_sync.py
